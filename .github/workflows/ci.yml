name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x server/ssh-haerten.sh client/ssh-zugang-einrichten.sh tests/*.sh

  windows:
    name: Windows-Client (PowerShell 5.1 und 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parsen in beiden PowerShell-Versionen
        shell: pwsh
        run: |
          $file = (Resolve-Path client/ssh-zugang-einrichten.ps1).Path
          $bytes = [IO.File]::ReadAllBytes($file)
          if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { throw "UTF-8-BOM fehlt – Windows PowerShell 5.1 liest Umlaute sonst falsch" }
          foreach ($exe in 'powershell', 'pwsh') {
            $count = & $exe -NoProfile -Command "`$e=`$null; `$null=[System.Management.Automation.Language.Parser]::ParseFile('$file',[ref]`$null,[ref]`$e); `$e.Count"
            if ($count -ne '0') { throw "$exe meldet $count Parserfehler" }
            Write-Host "ok: $exe"
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = foreach ($f in 'client/ssh-zugang-einrichten.ps1', 'tests/windows-acl.ps1') {
            Invoke-ScriptAnalyzer -Path $f -Severity Error
          }
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }
      - name: Dateirechte für OpenSSH (icacls)
        shell: powershell
        run: .\tests\windows-acl.ps1

  macos:
    name: macOS-Client (Bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Läuft mit der mitgelieferten Bash 3.2
        run: |
          /bin/bash --version | head -n 1
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ci
          set +e
          out=$(/bin/bash client/ssh-zugang-einrichten.sh -s 127.0.0.1 -p 1 -u ci -k id_ci -B </dev/null 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q "nicht erreichbar"

  server:
    name: Server ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
          - fedora:latest
          - rockylinux:9
          - almalinux:9
          - opensuse/leap:15.6
          - opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/server-container.sh

  e2e:
    name: Ende-zu-Ende (Ubuntu mit systemd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/e2e-ubuntu.sh
